<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-tertiary opacity-75"></span>

<h2 class="font-headline-lg text-headline-lg text-on-surface tracking-tight mb-space-xs">Masuk ke Akunmu</h2>
<p class="font-body-md text-body-md text-secondary max-w-[280px]">
      Kelola jadwal kuliah dan organisasi tanpa bentrok waktu.
    </p>

<!-- Main Login Card / Form Container -->
<div class="flex flex-col w-full bg-surface-container-lowest rounded-2xl shadow-sm p-space-lg mb-space-lg">
<form class="flex flex-col gap-space-md" id="loginForm" onsubmit="event.preventDefault();">
<!-- Input Email / NIM -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="studentId">Email Kampus atau NIM</label>
<div class="flex items-center gap-space-sm bg-surface-container-low rounded-xl px-space-md py-3 focus-within:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-secondary text-[20px]">school</span>
<input autocomplete="username" class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="studentId" name="studentId" placeholder="nama@mahasiswa.ac.id / NIM" required="" type="text"/>
</div>
</div>
<!-- Input Password -->
<div class="flex flex-col gap-1">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="password">Kata Sandi</label>
</div>
<div class="flex items-center gap-space-sm bg-surface-container-low rounded-xl px-space-md py-3 focus-within:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-secondary text-[20px]">lock</span>
<input autocomplete="current-password" class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Tampilkan atau sembunyikan kata sandi" class="flex items-center justify-center text-secondary hover:text-on-surface focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
<div class="flex justify-end mt-1">
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Lupa Kata Sandi?</a>
</div>
</div>
<!-- Submit Action Button -->
<button class="w-full mt-space-xs py-3.5 px-space-lg rounded-xl bg-primary-container text-on-primary font-headline-sm text-headline-sm shadow-md hover:opacity-95 active:scale-[0.98] transition-all flex items-center justify-center gap-space-xs" id="submitBtn" type="submit">
<span>Masuk Sekarang</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>

<svg class="w-4 h-4" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>

</button>

<div class="flex items-center justify-center text-center">

      <a class="font-headline-sm text-headline-sm text-primary hover:underline ml-1" href="#">Daftar di sini</a>
</p>
</div>

<script>
  // Password Visibility Toggle Interaction
  const togglePasswordBtn = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');

  if (togglePasswordBtn && passwordInput && eyeIcon) {
    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });
  }

  // Micro-feedback on submit
  const loginForm = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  if (loginForm && submitBtn) {
    loginForm.addEventListener('submit', () => {
      submitBtn.classList.add('opacity-80');
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>Memeriksa Akun...</span>';
      setTimeout(() => {
        submitBtn.innerHTML = originalText;
        submitBtn.classList.remove('opacity-80');
      }, 1200);
    });
  }
</script></main></body></html>
